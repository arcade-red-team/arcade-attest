[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arcade-attest"
version = "0.1.0"
description = "ArcadeAttest Decision API: deterministic architecture verdicts (PASS/WARN/BLOCK) with evidence packs, anchored on-chain via EAS."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "arcade-agent>=0.3.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
mcp = ["mcp>=1.2,<2"]
chain = ["web3>=6", "eth-abi>=5"]
dev = ["pytest>=8", "mcp>=1.2,<2"]

[project.scripts]
arcade-attest = "arcade_attest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
